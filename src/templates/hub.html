<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Hub</title>
<script type="application/ld+json">{{ jsonld|safe }}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg,#0d1117);
  color:var(--text,#e6edf3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;}
*::-webkit-scrollbar{width:8px;height:8px;}
*::-webkit-scrollbar-track{background:var(--surface2,#1c2128);}
*::-webkit-scrollbar-thumb{background:var(--border,#30363d);border-radius:4px;}
*::-webkit-scrollbar-thumb:hover{background:var(--muted,#8b949e);}
*{scrollbar-color:var(--border,#30363d) var(--surface2,#1c2128);scrollbar-width:thin;}

.instrument{display:flex;height:100%;gap:10px;padding:10px;overflow:hidden;}
.card{display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border,#30363d);border-radius:8px;background:var(--surface,#161b22);}
.card-left{flex:0 0 220px;}
.card-right{flex:1;min-width:0;}
.card-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-bottom:1px solid var(--border,#30363d);gap:8px;}
.card-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0;}
.card-title-icon{flex-shrink:0;font-size:14px;opacity:.7;}
.card-subtitle{font-size:11px;color:var(--muted,#8b949e);font-weight:400;flex-shrink:0;}
.refresh-btn{background:none;border:none;color:var(--muted,#8b949e);cursor:pointer;
  padding:3px 6px;border-radius:5px;font-size:14px;line-height:1;flex-shrink:0;
  transition:color .15s,background .15s;}
.refresh-btn:hover{color:var(--text,#e6edf3);background:var(--surface2,#1c2128);}
.refresh-btn.spinning{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card-body{flex:1;overflow-y:auto;padding:2px 0;}

/* Repo rows */
.repo-row{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid rgba(48,54,61,.4);transition:background .1s;}
.repo-row:last-child{border-bottom:none;}
.repo-row:hover,.repo-row.active{background:rgba(240,136,62,.08);}
.repo-row.active{border-left:2px solid var(--accent,#f0883e);}
.repo-icon{font-size:16px;flex-shrink:0;}
.repo-info{flex:1;min-width:0;}
.repo-name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.repo-meta{font-size:10px;color:var(--muted,#8b949e);margin-top:1px;}

/* Detail pane */
.detail-wrap{padding:14px 14px 10px;}
.detail-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.detail-desc{font-size:12px;color:var(--muted,#8b949e);margin-bottom:12px;line-height:1.5;}
.detail-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.action-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border,#30363d);
  background:var(--surface2,#1c2128);color:var(--text,#e6edf3);cursor:pointer;font-size:11px;
  font-family:inherit;transition:background .15s,border-color .15s;}
.action-btn:hover{border-color:var(--accent,#f0883e);background:rgba(240,136,62,.08);}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted,#8b949e);margin-bottom:6px;font-weight:600;}
.tag-row{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid rgba(48,54,61,.4);font-size:12px;}
.tag-row:last-child{border-bottom:none;}
.tag-name{font-weight:600;flex:1;}
.tag-size{font-size:11px;color:var(--muted,#8b949e);flex-shrink:0;min-width:55px;text-align:right;}
.tag-date{font-size:10px;color:var(--muted,#8b949e);flex-shrink:0;min-width:85px;text-align:right;}
.tag-open{background:none;border:1px solid var(--border,#30363d);border-radius:4px;
  color:var(--muted,#8b949e);cursor:pointer;padding:1px 6px;font-size:11px;flex-shrink:0;
  transition:color .15s,border-color .15s;}
.tag-open:hover{color:var(--accent,#f0883e);border-color:var(--accent,#f0883e);}

/* Collapsible docs section */
.docs-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  padding:10px 0 6px;border-top:1px solid var(--border,#30363d);margin-top:10px;}
.docs-toggle-icon{font-size:10px;color:var(--muted,#8b949e);transition:transform .2s;flex-shrink:0;}
.docs-toggle.open .docs-toggle-icon{transform:rotate(90deg);}
.docs-body{display:none;padding-top:6px;}
.docs-body.open{display:block;}
.docs-loading{font-size:12px;color:var(--muted,#8b949e);padding:8px 0;}

/* Rendered markdown styles */
.md h1{font-size:15px;font-weight:700;margin:14px 0 6px;color:var(--text,#e6edf3);}
.md h2{font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--accent,#f0883e);}
.md h3{font-size:12px;font-weight:700;margin:10px 0 4px;color:var(--text,#e6edf3);}
.md h4{font-size:12px;font-weight:600;margin:8px 0 3px;color:var(--muted,#8b949e);}
.md p{font-size:12px;line-height:1.6;margin:5px 0;color:var(--text,#e6edf3);}
.md ul{padding-left:16px;margin:5px 0;}
.md li{font-size:12px;line-height:1.6;color:var(--text,#e6edf3);margin:2px 0;}
.md strong{font-weight:700;}
.md code{background:var(--surface2,#1c2128);border:1px solid var(--border,#30363d);
  border-radius:3px;padding:1px 5px;font-family:'SF Mono','Fira Code',monospace;
  font-size:11px;color:var(--text,#e6edf3);}
.md pre{background:var(--surface2,#1c2128);border:1px solid var(--border,#30363d);
  border-radius:6px;padding:10px 12px;margin:6px 0;overflow-x:auto;}
.md pre code{background:none;border:none;padding:0;font-size:11px;line-height:1.5;}
.md table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px;}
.md th{background:var(--surface2,#1c2128);padding:5px 8px;text-align:left;
  border:1px solid var(--border,#30363d);font-weight:600;color:var(--muted,#8b949e);}
.md td{padding:5px 8px;border:1px solid var(--border,#30363d);vertical-align:top;line-height:1.4;}
.md tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.md blockquote{border-left:3px solid var(--accent,#f0883e);margin:6px 0;
  padding:6px 10px;background:rgba(240,136,62,.06);border-radius:0 4px 4px 0;
  font-size:12px;color:var(--muted,#8b949e);line-height:1.5;}
.md hr{border:none;border-top:1px solid var(--border,#30363d);margin:10px 0;}
.md a{color:var(--accent,#f0883e);text-decoration:none;cursor:pointer;}
.md a:hover{text-decoration:underline;}
.md h1:first-child{margin-top:4px;}

.state-msg{padding:16px 12px;font-size:12px;color:var(--muted,#8b949e);}
.state-error{color:var(--red,#f85149);}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:8px;color:var(--muted,#8b949e);}
.placeholder-icon{font-size:28px;opacity:.4;}
.placeholder-text{font-size:12px;}
</style>
</head>
<body>
<div class="instrument">
  <!-- Left: Repo list -->
  <div class="card card-left">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">☁️</span>
        <span>Repositories</span>
      </div>
      <span class="card-subtitle" id="hub-count"></span>
      <button class="refresh-btn" id="btn-hub" title="Refresh" onclick="loadRepos(true)">↺</button>
    </div>
    <div class="card-body" id="body-repos"><div class="state-msg">Loading…</div></div>
  </div>
  <!-- Right: Detail -->
  <div class="card card-right">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🏷</span>
        <span id="detail-header-name">Select a repository</span>
      </div>
    </div>
    <div class="card-body" id="body-detail">
      <div class="placeholder">
        <span class="placeholder-icon">☁️</span>
        <span class="placeholder-text">Select a repository to see its tags</span>
      </div>
    </div>
  </div>
</div>

<script>
const WCP_ORCHESTRATION_ID = "{{ wcp_orchestration_id|default('', true) }}";
const WCP_APPLICATION_ID   = "{{ wcp_application_id|default('', true) }}";

function wcpFetch(url, opts) {
  opts = opts || {};
  const h = {};
  if (WCP_ORCHESTRATION_ID) h['Wcp-Orchestration-Id'] = WCP_ORCHESTRATION_ID;
  if (WCP_APPLICATION_ID)   h['Wcp-Application-Id']   = WCP_APPLICATION_ID;
  opts.headers = Object.assign({}, opts.headers || {}, h);
  return fetch(url, opts);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60)  return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)   return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30)  return `${days}d ago`;
    return `${Math.floor(days / 30)}mo ago`;
  } catch { return '—'; }
}

function fmtPulls(n) {
  if (!n) return '';
  if (n >= 1e6)  return `${(n/1e6).toFixed(1)}M pulls`;
  if (n >= 1000) return `${(n/1000).toFixed(1)}K pulls`;
  return `${n} pulls`;
}

// ── Markdown renderer ────────────────────────────────────────────────────────

function renderMd(src) {
  const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function inline(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, (_,t) => `<strong>${t}</strong>`)
      .replace(/`([^`\n]+)`/g, (_,t) => `<code>${escHtml(t)}</code>`)
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,u) =>
        `<a href="#" onclick="openExternal('${escHtml(u)}');return false;">${escHtml(t)}</a>`);
  }

  const lines = src.split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code block
    if (line.startsWith('```')) {
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { codeLines.push(lines[i]); i++; }
      out.push(`<pre><code>${escHtml(codeLines.join('\n'))}</code></pre>`);
      i++; continue;
    }

    // Table
    if (line.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trimStart().startsWith('|')) { rows.push(lines[i]); i++; }
      const parseRow = r => r.split('|').slice(1,-1).map(c => c.trim());
      const isSep = r => /^[\s|:-]+$/.test(r);
      const headers = parseRow(rows[0]);
      let tbl = '<table><thead><tr>';
      headers.forEach(h => { tbl += `<th>${inline(h)}</th>`; });
      tbl += '</tr></thead><tbody>';
      for (let j = 1; j < rows.length; j++) {
        if (isSep(rows[j])) continue;
        tbl += '<tr>';
        parseRow(rows[j]).forEach(c => { tbl += `<td>${inline(c)}</td>`; });
        tbl += '</tr>';
      }
      tbl += '</tbody></table>';
      out.push(tbl); continue;
    }

    // Headings
    const hm = line.match(/^(#{1,4}) (.+)/);
    if (hm) { out.push(`<h${hm[1].length}>${inline(hm[2])}</h${hm[1].length}>`); i++; continue; }

    // HR
    if (/^-{3,}$/.test(line.trim())) { out.push('<hr>'); i++; continue; }

    // Blockquote
    if (line.startsWith('> ')) {
      const bq = [];
      while (i < lines.length && lines[i].startsWith('> ')) { bq.push(lines[i].slice(2)); i++; }
      out.push(`<blockquote>${bq.map(inline).join('<br>')}</blockquote>`);
      continue;
    }

    // Unordered list
    if (/^[-*] /.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*] /.test(lines[i])) {
        items.push(lines[i].replace(/^[-*] /, '')); i++;
      }
      out.push('<ul>' + items.map(t => `<li>${inline(t)}</li>`).join('') + '</ul>');
      continue;
    }

    // Blank line or paragraph
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    i++;
  }
  return out.join('\n');
}

// ── Repo list ────────────────────────────────────────────────────────────────

let _repos = [];
let _activeRepo = null;

async function loadRepos(force) {
  const btn = document.getElementById('btn-hub');
  btn.classList.add('spinning');
  try {
    const url = force ? '/widget/api/hub/repos?_=' + Date.now() : '/widget/api/hub/repos';
    const r = await wcpFetch(url);
    const data = await r.json();
    if (!data.success) {
      document.getElementById('body-repos').innerHTML =
        `<div class="state-msg state-error">${esc(data.error || 'Failed to load')}</div>`;
      return;
    }
    _repos = data.data.repos || [];
    document.getElementById('hub-count').textContent =
      `${_repos.length} repo${_repos.length !== 1 ? 's' : ''}`;
    renderRepoList();
  } catch (e) {
    document.getElementById('body-repos').innerHTML =
      `<div class="state-msg state-error">${esc(e.message)}</div>`;
  } finally {
    btn.classList.remove('spinning');
  }
}

function renderRepoList() {
  const body = document.getElementById('body-repos');
  if (!_repos.length) { body.innerHTML = '<div class="state-msg">No repositories found.</div>'; return; }
  body.innerHTML = _repos.map(r =>
    `<div class="repo-row${_activeRepo === r.name ? ' active' : ''}" onclick="selectRepo('${esc(r.name)}')">
      <span class="repo-icon">📦</span>
      <div class="repo-info">
        <div class="repo-name">${esc(r.display || r.name)}</div>
        <div class="repo-meta">${fmtDate(r.updated)}${r.pull_count ? ' · ' + fmtPulls(r.pull_count) : ''}</div>
      </div>
    </div>`
  ).join('');
}

// ── Repo detail ──────────────────────────────────────────────────────────────

async function selectRepo(name) {
  _activeRepo = name;
  renderRepoList();
  const repo = _repos.find(r => r.name === name);
  document.getElementById('detail-header-name').textContent = repo?.display || name;
  const body = document.getElementById('body-detail');
  body.innerHTML = '<div class="state-msg">Loading…</div>';
  try {
    const r = await wcpFetch(`/widget/api/hub/repos/${encodeURIComponent(name)}/tags`);
    const data = await r.json();
    if (!data.success) {
      body.innerHTML = `<div class="state-msg state-error">${esc(data.error)}</div>`;
      return;
    }
    const tags = (data.data.tags || []).sort((a,b) => new Date(b.updated) - new Date(a.updated));
    const hubUrl = `https://hub.docker.com/r/penrithbeacon/${encodeURIComponent(name)}`;
    const ghUrl  = `https://github.com/penrithbeacon/${encodeURIComponent(name)}`;

    body.innerHTML = `<div class="detail-wrap">
      <div class="detail-title">penrithbeacon/${esc(name)}</div>
      <div class="detail-desc">${esc(repo?.description || '—')}</div>
      <div class="detail-actions">
        <button class="action-btn" onclick="openExternal('${esc(hubUrl)}')">↗ Docker Hub</button>
        <button class="action-btn" onclick="openExternal('${esc(ghUrl)}')">↗ GitHub</button>
      </div>
      <div class="section-label">Tags (${tags.length})</div>
      ${tags.length ? tags.map(t => {
        const tagUrl = `${hubUrl}/tags?name=${encodeURIComponent(t.name)}`;
        return `<div class="tag-row">
          <span class="tag-name">${esc(t.name)}</span>
          <span class="tag-size">${esc(t.size)}</span>
          <span class="tag-date">${fmtDate(t.updated)}</span>
          <button class="tag-open" onclick="openExternal('${esc(tagUrl)}')" title="Open on Docker Hub">↗</button>
        </div>`;
      }).join('') : '<div class="state-msg">No tags found.</div>'}
      <div class="docs-toggle" id="docs-toggle-${esc(name)}" onclick="toggleDocs('${esc(name)}')">
        <span class="docs-toggle-icon">▶</span>
        <span class="section-label" style="margin:0;">Documentation</span>
      </div>
      <div class="docs-body" id="docs-body-${esc(name)}">
        <div class="docs-loading">Loading…</div>
      </div>
    </div>`;
  } catch (e) {
    body.innerHTML = `<div class="state-msg state-error">${esc(e.message)}</div>`;
  }
}

let _descCache = {};
let _docsOpen  = {};

async function toggleDocs(name) {
  const toggle = document.getElementById(`docs-toggle-${name}`);
  const body   = document.getElementById(`docs-body-${name}`);
  if (!toggle || !body) return;
  const nowOpen = !_docsOpen[name];
  _docsOpen[name] = nowOpen;
  toggle.classList.toggle('open', nowOpen);
  body.classList.toggle('open', nowOpen);
  if (!nowOpen) return;

  // Already loaded
  if (_descCache[name]) {
    body.innerHTML = `<div class="md">${_descCache[name]}</div>`;
    return;
  }
  body.innerHTML = '<div class="docs-loading">Loading…</div>';
  try {
    const r = await wcpFetch(`/widget/api/hub/repos/${encodeURIComponent(name)}/description`);
    const data = await r.json();
    if (!data.success || !data.data.description) {
      body.innerHTML = '<div class="docs-loading">No documentation available.</div>';
      return;
    }
    _descCache[name] = renderMd(data.data.description);
    body.innerHTML = `<div class="md">${_descCache[name]}</div>`;
  } catch (e) {
    body.innerHTML = `<div class="state-msg state-error">${esc(e.message)}</div>`;
  }
}

function openExternal(url) {
  window.parent?.postMessage({ type: 'wcp:open-window', url, width: 1100, height: 700 }, '*');
}

loadRepos(false);

function _applyThemeVars(vars) {
  for (const [k, v] of Object.entries(vars))
    document.documentElement.style.setProperty(k, v);
}
window.parent?.postMessage({ type: 'wcp:ready' }, '*');
window.parent?.postMessage({ type: 'wcp:request-theme' }, '*');
window.addEventListener('message', e => {
  if (e.data?.type === 'wcp:context' && e.data.theme) _applyThemeVars(e.data.theme);
  if (e.data?.type === 'wcp:theme' && e.data.vars)    _applyThemeVars(e.data.vars);
});
</script>
</body>
</html>
